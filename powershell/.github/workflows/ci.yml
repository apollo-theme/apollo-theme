name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify generated module
        shell: pwsh
        run: python scripts/generate.py --check
      - name: Run checker
        shell: pwsh
        run: python scripts/check.py
      - name: Run Python tests
        shell: pwsh
        run: python -m unittest discover -s tests -v
      - name: Run direct PowerShell assertions
        shell: pwsh
        run: ./tests/Test-ApolloTheme.ps1
