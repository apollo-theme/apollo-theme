name: Firefox release
on:
  push: { tags: ["firefox-v*"] }
  # Re-run a tag whose push did not start this workflow (see CLAUDE.md Releases).
  workflow_dispatch: { inputs: { tag: { description: "Existing firefox-vX.Y.Z tag to release", required: true, type: string } } }
permissions: { contents: write }
env: { TAG: "${{ inputs.tag || github.ref_name }}" }
jobs:
  release:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: firefox } }
    steps:
      - { uses: actions/checkout@v4, with: { ref: "${{ env.TAG }}", fetch-depth: 0 } }
      - { uses: actions/setup-python@v5, with: { python-version: "3.11" } }
      - name: Check tag is firefox-vX.Y.Z and matches the manifests
        run: python3 ../scripts/firefox_release.py --dry-run "$TAG" --skip-build
      - { uses: actions/setup-node@v4, with: { node-version: 20, cache: npm, cache-dependency-path: firefox/package-lock.json } }
      - run: npm ci && npm run check && npm test && npm run lint
      - run: python3 ../scripts/firefox_release.py --dry-run "$TAG" --notes-out RELEASE_NOTES.md
      - uses: softprops/action-gh-release@v2
        with: { tag_name: "${{ env.TAG }}", name: "Apollo Themes for Firefox ${{ env.TAG }}", body_path: firefox/RELEASE_NOTES.md, fail_on_unmatched_files: true,
                files: "firefox/web-ext-artifacts/apollo-theme.zip\nfirefox/web-ext-artifacts/apollo-light-theme.zip\nfirefox/web-ext-artifacts/SHA256SUMS" }
