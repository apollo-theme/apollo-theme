name: App release
on:
  push: { tags: ["**", "!firefox-v*"] }
  # Re-run a tag whose push did not start this workflow (see CLAUDE.md Releases).
  workflow_dispatch: { inputs: { tag: { description: "Existing <app>-vX.Y.Z tag to release", required: true, type: string } } }
permissions: { contents: write }
env: { TAG: "${{ inputs.tag || github.ref_name }}" }
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - { uses: actions/checkout@v4, with: { ref: "${{ env.TAG }}", fetch-depth: 0 } }
      - { uses: actions/setup-python@v5, with: { python-version: "3.11" } }
      - name: Check tag is <app>-vX.Y.Z for a known app
        run: python3 scripts/app_release.py --check-tag "$TAG" --github-env "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        if: env.APP == 'vscode'
        with: { node-version: "22", cache: npm, cache-dependency-path: vscode/package-lock.json }
      - if: env.APP == 'vscode'
        run: npm ci
        working-directory: vscode
      - run: python3 scripts/generate.py --check --app "$APP" && python3 scripts/check.py --app "$APP"
      - run: python3 -m unittest discover -s tests -v
        working-directory: ${{ env.APP }}
      - run: python3 scripts/app_release.py --dry-run "$TAG" --out release-assets --notes-out RELEASE_NOTES.md
      - uses: softprops/action-gh-release@v2
        with: { tag_name: "${{ env.TAG }}", name: "Apollo Themes for ${{ env.APP_NAME }} ${{ env.TAG }}", body_path: RELEASE_NOTES.md, fail_on_unmatched_files: true, files: "release-assets/*" }
