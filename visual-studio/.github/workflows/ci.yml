name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install --yes libxml2-utils
      - run: python3 scripts/generate.py --check
      - run: python3 scripts/check.py
      - run: python3 -m unittest discover -s tests -v
      - run: xmllint --noout --schema schemas/vstheme.xsd themes/Apollo.vstheme "themes/Apollo Light.vstheme"

  windows-validation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/generate.py --check
      - run: python scripts/check.py
      - run: python -m unittest discover -s tests -v
      - name: Validate native Visual Studio theme XML
        shell: pwsh
        run: ./scripts/validate.ps1
      - name: Stage importable theme artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          Copy-Item themes/Apollo.vstheme artifacts/Apollo.vstheme
          Copy-Item "themes/Apollo Light.vstheme" "artifacts/Apollo Light.vstheme"
      - uses: actions/upload-artifact@v4
        with:
          name: Apollo-vsthemes
          path: artifacts/*.vstheme
